name: test

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'pre-release/**'
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Lint and unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            # No npm cache: zizmor flags it as a cache poisoning risk in a
            # workflow that runs on pushes to main, as ci.yaml does too.
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  package-manager-cache: false

            # The checks need no install scripts. Leaving them out also skips
            # the Puppeteer browser download and the native builds.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Run unit tests
              run: npm test
