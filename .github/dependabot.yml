version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 7
    ignore:
      # mermaid-cli 12 draws the README PDF diagrams in a new theme and
      # much larger, so two of them split across pages (see #236). Stay
      # on 11 until the PDF script sets its own theme and size.
      - dependency-name: "@mermaid-js/mermaid-cli"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    groups:
      # CodeQL needs the same version in every step (init, autobuild,
      # analyze, upload-sarif), so bump them all in one pull request.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
    schedule:
      interval: "weekly"
