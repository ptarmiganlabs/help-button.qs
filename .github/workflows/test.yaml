name: test

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'pre-release/**'
    pull_request:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Lint and unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No npm cache: zizmor flags it as a cache poisoning risk in a
            # workflow that runs on pushes to main, as ci.yaml does too.
            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  package-manager-cache: false

            # The checks need no install scripts. Leaving them out also skips
            # the Puppeteer browser download and the native builds.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Run unit tests
              run: npm test
