name: ci
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'pre-release/**'

permissions: {}

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            releases_created: ${{ steps.provide.outputs.releases_created }}
            release_tag_name: ${{ steps.provide.outputs['release_tag_name'] }}
            release_version: ${{ steps.provide.outputs['release_version'] }}
            release_upload_url: ${{ steps.provide.outputs['release_upload_url'] }}
            is_prerelease: ${{ steps.provide.outputs['is_prerelease'] }}
        env:
            GITHUB_REF: ${{ github.ref }}
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
            IS_PRERELEASE_BRANCH: ${{ startsWith(github.ref, 'refs/heads/pre-release/') }}
        steps:
            - name: Show github.ref
              run: echo "$GITHUB_REF"

            - name: Show release-please job variables
              env:
                  CI_GITHUB_REF: ${{ github.ref }}
                  CI_GITHUB_REF_NAME: ${{ github.ref_name }}
                  CI_GITHUB_EVENT_NAME: ${{ github.event_name }}
                  CI_GITHUB_REPOSITORY: ${{ github.repository }}
                  CI_GITHUB_SHA: ${{ github.sha }}
              run: |
                  echo "=== Trigger ==="
                  echo "github.ref         : $CI_GITHUB_REF"
                  echo "github.ref_name    : $CI_GITHUB_REF_NAME"
                  echo "github.event_name  : $CI_GITHUB_EVENT_NAME"
                  echo "github.repository  : $CI_GITHUB_REPOSITORY"
                  echo "github.sha         : $CI_GITHUB_SHA"
                  echo ""
                  echo "=== Pre-release detection ==="
                  echo "IS_PRERELEASE_BRANCH: $IS_PRERELEASE_BRANCH"

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Determine config file
              id: config
              run: |
                  if [ "$IS_PRERELEASE_BRANCH" = "true" ]; then
                    PRERELEASE_TYPE="${GITHUB_REF#refs/heads/pre-release/}"
                    echo "PRERELEASE_TYPE    : $PRERELEASE_TYPE"
                    case "$PRERELEASE_TYPE" in
                      alpha|beta|rc)
                        echo "config_file=release-please-prerelease-${PRERELEASE_TYPE}.json" >> $GITHUB_OUTPUT
                        ;;
                      *)
                        echo "config_file=release-please-prerelease.json" >> $GITHUB_OUTPUT
                        ;;
                    esac
                    echo "target_branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
                  else
                    echo "config_file=release-please-config.json" >> $GITHUB_OUTPUT
                    echo "target_branch=main" >> $GITHUB_OUTPUT
                  fi

                  echo ""
                  echo "=== Release-please config ==="
                  cat $GITHUB_OUTPUT

            - name: Decide release action and next RC
              id: decide
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
              run: |
                  # Run helper which emits key=value lines to stdout
                  node scripts/rc-version-helper.mjs > /tmp/decide.out || true
                  cat /tmp/decide.out
                  while read -r line; do
                    echo "$line" >> $GITHUB_OUTPUT
                  done < /tmp/decide.out

            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              if: github.repository_owner == 'ptarmiganlabs' && steps.decide.outputs.action == 'run_release_please'
              with:
                  token: ${{ secrets.RELEASE_PLEASE_PAT }}
                  config-file: ${{ steps.config.outputs.config_file }}
                  manifest-file: .release-please-manifest.json
                  target-branch: ${{ steps.config.outputs.target_branch }}

            - name: Provide release outputs
              id: provide
              env:
                  RELEASE_CREATED_FLAG: ${{ steps.release.outputs.releases_created }}
                  RELEASE_TAG_NAME: ${{ steps.release.outputs.tag_name }}
                  RELEASE_VERSION: ${{ steps.release.outputs.version }}
                  RELEASE_UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
                  RELEASE_IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
                  DECIDE_RELEASE_CREATED_FLAG: ${{ steps.decide.outputs.releases_created }}
                  DECIDE_RELEASE_TAG_NAME: ${{ steps.decide.outputs.release_tag_name }}
                  DECIDE_RELEASE_VERSION: ${{ steps.decide.outputs.release_version }}
                  DECIDE_RELEASE_UPLOAD_URL: ${{ steps.decide.outputs.release_upload_url }}
                  DECIDE_RELEASE_IS_PRERELEASE: ${{ steps.decide.outputs.is_prerelease }}
              run: |
                  write_output() {
                    printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
                  }

                  # If release-please ran and produced outputs, use them; otherwise use the decide outputs
                  if [ -n "$RELEASE_TAG_NAME" ]; then
                    write_output "releases_created" "$RELEASE_CREATED_FLAG"
                    write_output "release_tag_name" "$RELEASE_TAG_NAME"
                    write_output "release_version" "$RELEASE_VERSION"
                    write_output "release_upload_url" "$RELEASE_UPLOAD_URL"
                    write_output "is_prerelease" "$RELEASE_IS_PRERELEASE"
                  else
                    write_output "releases_created" "$DECIDE_RELEASE_CREATED_FLAG"
                    write_output "release_tag_name" "$DECIDE_RELEASE_TAG_NAME"
                    write_output "release_version" "$DECIDE_RELEASE_VERSION"
                    write_output "release_upload_url" "$DECIDE_RELEASE_UPLOAD_URL"
                    write_output "is_prerelease" "$DECIDE_RELEASE_IS_PRERELEASE"
                  fi

            - name: Show output from Release-Please
              if: always()
              env:
                  RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
              run: echo "$RELEASE_PLEASE_OUTPUT"

            - name: Show output from Release-Please
              env:
                  RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
                  RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
                  RELEASE_DRAFT: ${{ steps.release.outputs['draft'] }}
                  RELEASE_PATH: ${{ steps.release.outputs['path'] }}
                  RELEASE_UPLOAD_URL: ${{ steps.release.outputs['upload_url'] }}
                  RELEASE_HTML_URL: ${{ steps.release.outputs['html_url'] }}
                  RELEASE_TAG_NAME: ${{ steps.release.outputs['tag_name'] }}
                  RELEASE_VERSION: ${{ steps.release.outputs['version'] }}
                  RELEASE_MAJOR: ${{ steps.release.outputs['major'] }}
                  RELEASE_MINOR: ${{ steps.release.outputs['minor'] }}
                  RELEASE_PATCH: ${{ steps.release.outputs['patch'] }}
                  RELEASE_SHA: ${{ steps.release.outputs['sha'] }}
              run: |
                  echo "releases_created: $RELEASES_CREATED"
                  echo "release_created : $RELEASE_CREATED"
                  echo "draft           : $RELEASE_DRAFT"
                  echo "path            : $RELEASE_PATH"
                  echo "upload_url      : $RELEASE_UPLOAD_URL"
                  echo "html_url        : $RELEASE_HTML_URL"
                  echo "tag_name        : $RELEASE_TAG_NAME"
                  echo "version         : $RELEASE_VERSION"
                  echo "major           : $RELEASE_MAJOR"
                  echo "minor           : $RELEASE_MINOR"
                  echo "patch           : $RELEASE_PATCH"
                  echo "sha             : $RELEASE_SHA"

    build-release:
        needs: release-please
        runs-on: ubuntu-latest
        if: needs.release-please.outputs.releases_created == 'true'
        permissions:
            contents: write
        env:
            DIST_FILE_NAME: helpbutton-qs
            IS_PRERELEASE: ${{ startsWith(github.ref, 'refs/heads/pre-release/') }}
        steps:
            - name: Show build-release job variables
              env:
                  CI_GITHUB_REF: ${{ github.ref }}
                  CI_GITHUB_REF_NAME: ${{ github.ref_name }}
                  CI_GITHUB_SHA: ${{ github.sha }}
                  RELEASES_CREATED: ${{ needs.release-please.outputs.releases_created }}
                  RELEASE_TAG_NAME: ${{ needs.release-please.outputs.release_tag_name }}
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
                  RELEASE_UPLOAD_URL: ${{ needs.release-please.outputs.release_upload_url }}
                  RELEASE_IS_PRERELEASE: ${{ needs.release-please.outputs.is_prerelease }}
              run: |
                  echo "=== Trigger ==="
                  echo "github.ref         : $CI_GITHUB_REF"
                  echo "github.ref_name    : $CI_GITHUB_REF_NAME"
                  echo "github.sha         : $CI_GITHUB_SHA"
                  echo ""
                  echo "=== Build flags ==="
                  echo "DIST_FILE_NAME     : $DIST_FILE_NAME"
                  echo "IS_PRERELEASE      : $IS_PRERELEASE"
                  echo ""
                  echo "=== Release-please outputs ==="
                  echo "releases_created   : $RELEASES_CREATED"
                  echo "release_tag_name   : $RELEASE_TAG_NAME"
                  echo "release_version    : $RELEASE_VERSION"
                  echo "release_upload_url : $RELEASE_UPLOAD_URL"
                  echo "is_prerelease      : $RELEASE_IS_PRERELEASE"

            - name: Determine pre-release suffix
              id: prerelease
              env:
                  RELEASE_TAG_NAME_INPUT: ${{ needs.release-please.outputs.release_tag_name }}
                  RELEASE_VERSION_INPUT: ${{ needs.release-please.outputs.release_version }}
              run: |
                  if [ "$IS_PRERELEASE" = "true" ]; then
                    PRERELEASE_TYPE="${GITHUB_REF#refs/heads/pre-release/}"
                    # Prefer to derive suffix from the release tag name (set by release-please or decide)
                    TAG_NAME="$RELEASE_TAG_NAME_INPUT"
                    # Strip optional package prefix like "helpbutton-qs-v" or just a leading "v"
                    # This handles tags like "helpbutton-qs-v2.5.6-rc.0" -> "2.5.6-rc.0"
                    TAG_NO_V="${TAG_NAME#*-v}"
                    if [ "$TAG_NO_V" = "$TAG_NAME" ]; then
                      # No "<pkg>-v" prefix found; fall back to stripping just a leading "v"
                      TAG_NO_V="${TAG_NAME#v}"
                    fi

                    if [[ "$TAG_NO_V" =~ -${PRERELEASE_TYPE}\.([0-9]+)$ ]]; then
                      # Suffix already embedded in tag name; leave PRERELEASE_SUFFIX empty to avoid duplication
                      PRERELEASE_SUFFIX=""
                      RELEASE_VERSION="$TAG_NO_V"
                    elif [[ "$RELEASE_VERSION_INPUT" =~ -${PRERELEASE_TYPE}\.([0-9]+) ]]; then
                      # Suffix already embedded in release_version; leave PRERELEASE_SUFFIX empty to avoid duplication
                      PRERELEASE_SUFFIX=""
                      RELEASE_VERSION="$RELEASE_VERSION_INPUT"
                    else
                      PRERELEASE_SUFFIX="-${PRERELEASE_TYPE}.0"
                      # fallback release version is the base release_version output
                      RELEASE_VERSION="$RELEASE_VERSION_INPUT"
                    fi

                    echo "PRERELEASE_TYPE: $PRERELEASE_TYPE"
                    echo "PRERELEASE_SUFFIX: $PRERELEASE_SUFFIX"
                    echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
                    echo "prerelease_suffix=${PRERELEASE_SUFFIX}" >> $GITHUB_OUTPUT
                  else
                    echo "prerelease_suffix=" >> $GITHUB_OUTPUT
                  fi

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: Build extension
              run: |
                  PUPPETEER_SKIP_DOWNLOAD=true npm ci
                  npm run pack:prod

            - name: Generate README PDF
              run: npm run generate-pdf

            - name: Create extension release zip
              env:
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
                  RELEASE_PRERELEASE_SUFFIX: ${{ steps.prerelease.outputs.prerelease_suffix }}
              run: |
                  VERSION="$RELEASE_VERSION"
                  PRERELEASE_SUFFIX="$RELEASE_PRERELEASE_SUFFIX"

                  # Create readme.txt from template
                  sed "s/__VERSION__/${VERSION}/g" release-config/readme-template.txt > readme.txt

                  mkdir -p release-staging release-artifacts

                  cp "${DIST_FILE_NAME}.zip" "release-staging/${DIST_FILE_NAME}.zip"
                  cp README.pdf release-staging/README.pdf
                  cp readme.txt release-staging/readme.txt
                  cp LICENSE release-staging/LICENSE

                  cd release-staging
                  zip -r "../release-artifacts/${DIST_FILE_NAME}-v${VERSION}${PRERELEASE_SUFFIX}.zip" .
                  cd ..

                  echo ""
                  echo "=== Outer release zip ==="
                  zipinfo "release-artifacts/${DIST_FILE_NAME}-v${VERSION}${PRERELEASE_SUFFIX}.zip"
                  echo ""
                  echo "=== Inner extension zip ==="
                  zipinfo "release-staging/${DIST_FILE_NAME}.zip"

            - name: Generate CycloneDX SBOM
              env:
                  VERSION: ${{ needs.release-please.outputs.release_version }}
                  PRERELEASE_SUFFIX: ${{ steps.prerelease.outputs.prerelease_suffix }}
              run: |
                  SBOM_FILE="release-artifacts/${DIST_FILE_NAME}-v${VERSION}${PRERELEASE_SUFFIX}.sbom.cdx.json"

                  ./node_modules/.bin/cyclonedx-npm \
                    --omit dev \
                    --output-reproducible \
                    --output-format JSON \
                    --output-file "${SBOM_FILE}"

                  test -s "${SBOM_FILE}" || { echo "SBOM file missing or empty"; exit 1; }

            - name: Upload release artifacts
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  omitDraftDuringUpdate: true
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  token: ${{ secrets.RELEASE_PLEASE_PAT }}
                  artifacts: 'release-artifacts/*'
                  prerelease: ${{ env.IS_PRERELEASE }}

            - name: Fix pre-release name to include type suffix
              if: env.IS_PRERELEASE == 'true'
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
                  VERSION: ${{ needs.release-please.outputs.release_version }}
                  TAG: ${{ needs.release-please.outputs.release_tag_name }}
              run: |
                  PRERELEASE_TYPE="${GITHUB_REF#refs/heads/pre-release/}"
                  case "$PRERELEASE_TYPE" in
                    alpha|beta|rc) ;;
                    *) echo "Unknown prerelease type '$PRERELEASE_TYPE', skipping rename"; exit 0 ;;
                  esac

                  # If release-please already added the suffix (e.g. 2.5.1-rc.0), nothing to do
                  if [[ "$VERSION" == *"-${PRERELEASE_TYPE}."* ]]; then
                    echo "Version $VERSION already has correct -${PRERELEASE_TYPE}.N suffix, no rename needed"
                    exit 0
                  fi

                  # Derive the prerelease counter from the existing release name, defaulting to 0
                  CURRENT_NAME=$(gh release view "$TAG" --json name -q .name)
                  if [[ "$CURRENT_NAME" =~ -${PRERELEASE_TYPE}\.([0-9]+)$ ]]; then
                    N="${BASH_REMATCH[1]}"
                  else
                    N=0
                  fi

                  NEW_NAME="helpbutton-qs: v${VERSION}-${PRERELEASE_TYPE}.${N}"
                  echo "Renaming release '$CURRENT_NAME' → '$NEW_NAME'"
                  gh release edit "$TAG" --title "$NEW_NAME"
