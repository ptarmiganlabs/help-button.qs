version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
    schedule:
      interval: "weekly"
